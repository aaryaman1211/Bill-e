{% extends "base.html" %}

{% block title %}Sign in · Bill-e{% endblock %}

{% block content %}
<section class="card auth-card">
  <div class="tabs" role="tablist" aria-label="Sign in or create an account">
    <button type="button" role="tab" id="tab-signin" aria-selected="true" data-mode="signin">Sign in</button>
    <button type="button" role="tab" id="tab-signup" aria-selected="false" data-mode="signup">Create account</button>
  </div>

  <p id="auth-intro" class="muted">Sign in to keep your bills on every device. You don't need an account to split a bill.</p>

  <button id="google-button" class="btn btn-block google-button" type="button">
    <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
    Continue with Google
  </button>

  <div class="divider"><span>or with email</span></div>

  <form id="auth-form" class="stack" novalidate>
    <label class="field" id="name-field" hidden>
      <span>Your name</span>
      <input name="name" autocomplete="name" maxlength="30" placeholder="e.g. Aaryaman">
    </label>
    <label class="field">
      <span>Email</span>
      <input name="email" type="email" autocomplete="email" required placeholder="you@example.com">
    </label>
    <label class="field">
      <span>Password</span>
      <input name="password" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters">
    </label>
    <button id="submit-button" class="btn btn-primary" type="submit">Sign in</button>
    <button id="forgot-button" class="link-button" type="button">Forgot password?</button>
  </form>
</section>

<p class="center muted small"><a href="/">← Back to Bill-e</a></p>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
